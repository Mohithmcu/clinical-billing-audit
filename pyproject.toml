[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clinical-billing-audit"
version = "1.0.0"
description = "Clinical Note-to-Billing Code Consistency Checker for FWA Triage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mohith", email = "mohith@example.com"},
]
keywords = [
    "nlp", "clinical-notes", "billing-audit", "fraud-detection",
    "anomaly-detection", "healthcare", "icd-codes", "fwa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "spacy>=3.7",
    "scispacy>=0.5.4",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.30",
    "torch>=2.0",
    "datasets>=2.14",
    "accelerate>=0.21",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.3",
]
all = [
    "clinical-billing-audit[transformers,dev]",
]

[project.scripts]
cba = "clinical_billing_audit.cli:main"

[project.urls]
Homepage = "https://github.com/mohith/clinical-billing-audit"
Repository = "https://github.com/mohith/clinical-billing-audit"
Issues = "https://github.com/mohith/clinical-billing-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=clinical_billing_audit --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
